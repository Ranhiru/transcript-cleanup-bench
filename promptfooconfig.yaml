# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "Local model benchmark for transcript cleanup"

# Listed explicitly rather than globbed like tests/ below: the labels are the
# comparison axis in every result, and glob order is filesystem order, which
# put v2 first. A glob silently discards any label you attach.
prompts:
  - id: file://prompts/v1.txt
    label: v1
  - id: file://prompts/v2.txt
    label: v2

providers:
  - id: openai:chat:gemma-4-e4b-it-4bit
    label: "Gemma 4 E4B"
    config: &shared
      apiBaseUrl: http://localhost:8000/v1
      apiKeyEnvar: OMLX_API_KEY
      temperature: 0
      max_tokens: 8192
      # Non-OpenAI body params are spread into the request body verbatim.
      passthrough:
        top_p: 1.0
        top_k: 0            # 0 disables it; verified against the server
        min_p: 0.0
        presence_penalty: 0
        frequency_penalty: 0
        repetition_penalty: 1.0
  - id: openai:chat:gemma-4-E2B-it-MLX-4bit
    label: "Gemma 4 E2B"
    config: *shared
  - id: openai:chat:gemma-4-12B-it-qat-4bit
    label: "Gemma 4 12B QAT"
    config: *shared
  - id: openai:chat:Qwen3.6-35B-A3B-MLX-4bit
    label: "Qwen 3.6 35B-A3B"
    config:
      apiBaseUrl: http://localhost:8000/v1
      apiKeyEnvar: OMLX_API_KEY
      temperature: 0
      max_tokens: 8192
      passthrough:
        top_p: 1.0
        top_k: 0
        min_p: 0.0
        presence_penalty: 0
        frequency_penalty: 0
        repetition_penalty: 1.0
        # Without this Qwen emits reasoning tokens (~1,100 completion tokens
        # instead of ~12) and takes 18s per request instead of 1s.
        chat_template_kwargs:
          enable_thinking: false

commandLineOptions:
  maxConcurrency: 8

defaultTest:
  options:
    transform: 'output.trim()'

tests:
  - file://tests/*.yaml
