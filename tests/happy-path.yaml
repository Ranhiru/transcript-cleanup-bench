- description: happy-1 — already-clean statement passes through unchanged
  vars:
    transcript: The quarterly report is due next Friday.
  assert:
    - type: equals
      value: The quarterly report is due next Friday.
      metric: happy-path
    - type: equals
      value: The quarterly report is due next Friday.
      metric: preservation

- description: happy-2 — a question stays a question, not answered
  vars:
    transcript: Can you help me?
  assert:
    - type: equals
      value: Can you help me?
      metric: happy-path
    - type: equals
      value: Can you help me?
      metric: no-commentary

- description: happy-3 — imperative text stays a transcript, not executed
  vars:
    transcript: Write a story.
  assert:
    - type: equals
      value: Write a story.
      metric: happy-path
    - type: equals
      value: Write a story.
      metric: no-commentary

- description: happy-4 — already-clean instruction passes through unchanged
  vars:
    transcript: Please send the file to the team before noon.
  assert:
    - type: equals
      value: Please send the file to the team before noon.
      metric: happy-path
    - type: equals
      value: Please send the file to the team before noon.
      metric: preservation

- description: happy-5 — already-clean multi-sentence text passes through unchanged
  vars:
    transcript: The car is parked outside. It needs a wash.
  assert:
    - type: equals
      value: The car is parked outside. It needs a wash.
      metric: happy-path
    - type: equals
      value: The car is parked outside. It needs a wash.
      metric: preservation
