# Long-form dictation — 30-60 seconds of speech each (roughly 85-120 words at a
# normal 150 wpm). Everything else in tests/ is a single sentence, which only ever
# exercises one rule at a time. These cases exist because the failure modes at
# length are different ones: the model stops cleaning halfway through, drops the
# tail of a list, summarises instead of transcribing, or applies STEP 4 and STEP 5
# to the opening and then forgets them by the end.
#
# `equals` is unusable at this length, so each case asserts the specific
# transformations the prompt promises plus the structural shape of the output
# (blank line after a salutation, N consecutive bullet lines, two paragraph
# breaks). The exception is long-5, where "unchanged" is the whole assertion.
#
# Assertion notes:
#   - promptfoo compiles regex with no flags, so `^`/`$` anchor the whole string
#     (never a line) and `.` never crosses a newline — `[\s\S]` is used for that.
#   - Bullet markers are matched as [-*•] because the prompt says "bullet point
#     list" without pinning a character.
#   - The no-commentary anchors reproduce the ones in numbers-symbols.yaml; YAML
#     anchors do not cross file boundaries, so they are redeclared here.

- description: long-1 — dictated email (~45s) — salutation/sign-off shape, money, percent, phone, time
  vars:
    transcript: >-
      Hi David, um I wanted to follow up on the quote you sent over last week. We
      reviewed it internally and the total came out to twelve thousand five hundred
      dollars which is about ten percent over the budget we set back in January. I mean
      if we drop the extended warranty from the scope we should be able to get under the
      line. Can you send me a revised version before Friday? Also my new number is five
      five five, two one four, eight nine zero zero, so please update it in your system.
      I'm usually free after ten thirty AM if you'd rather talk it through on a call.
      Thanks, Michael
  assert:
    - type: regex
      value: '^Hi David,\n\n'
      metric: long-form
    - type: regex
      value: 'Thanks,\s+Michael\.?$'
      metric: long-form
    - type: regex
      value: '\$12,500\b'
      metric: long-form
    - type: contains
      value: 10%
      metric: long-form
    - type: contains
      value: +1-555-214-8900
      metric: long-form
    - type: regex
      value: '10:30 ?[Aa]\.?[Mm]\.?'
      metric: long-form
    - type: not-regex
      value: '\bum\b'
      metric: long-form
    - type: not-icontains
      value: I mean
      metric: long-form
    - &no-commentary-start
      type: not-regex
      value: "^\\s*([Ss]ure|[Cc]ertainly|[Oo]f course|[Hh]ere('|’)s|[Oo]kay|[Ii] can|[Ii]'d be happy|[Aa]s an [Aa][Ii])"
      metric: no-commentary
    - &no-commentary-phrases
      type: not-icontains-any
      value:
        - here is the cleaned
        - i hope this helps
        - let me know
      metric: no-commentary

- description: long-2 — three-topic narrative (~50s) — four mishears plus paragraph breaks across the whole transcript
  vars:
    transcript: >-
      so this morning I drove out to the workshop and started pulling apart the engine on
      the old truck um the oil looked really vicious when it came out which probably
      means it hasn't been changed in years and there was a strange noise coming from the
      wheel train the whole time the engine was warming up after lunch I switched over to
      the paperwork side of things I called the supplier about the parts order and you
      know they said the studies of the shipment is still pending so I asked them for a
      true check on the whole order before it leaves the warehouse tonight I'll write up
      everything I found and send it over to Rachel so she has it before the meeting
      tomorrow morning
  assert:
    # The mishears are spread across the beginning, middle and end on purpose —
    # a model that stops cleaning after the first paragraph still passes the first
    # two of these and fails the last two.
    - type: contains
      value: viscous
      metric: long-form
    - type: contains
      value: valve train
      metric: long-form
    - type: contains
      value: status
      metric: long-form
    - type: contains
      value: thorough check
      metric: long-form
    - type: not-icontains
      value: studies
      metric: long-form
    # Two blank lines = three paragraphs, one per topic (workshop, paperwork, tonight).
    - type: regex
      value: '\n\n[\s\S]+\n\n'
      metric: long-form
    - type: not-regex
      value: '\bum\b'
      metric: long-form
    - type: not-icontains
      value: you know
      metric: long-form
    - *no-commentary-start
    - *no-commentary-phrases

- description: long-3 — five-item list buried mid-transcript (~40s) — list survives the surrounding prose
  vars:
    transcript: >-
      so for the office move next month there's a whole bunch of stuff we still need to
      sort out I've been going back and forth with the building manager and he wants
      everything confirmed by the fifteenth we need to book the removalists, cancel the
      old internet line, update the address on the website, order new desk chairs, and
      organise parking permits for the team I think the chairs are the long pole here
      because the supplier quoted six weeks once that's sorted I'll put together a proper
      timeline and share it with everyone on Monday morning
  assert:
    # Five consecutive bullet lines. The common failure is bulletising three or
    # four items and folding the rest back into the sentence, which this catches.
    - type: regex
      value: '(?:\n[-*•][^\n]*){5}'
      metric: long-form
    - type: contains
      value: removalists
      metric: long-form
    - type: contains
      value: parking permits
      metric: long-form
    - type: regex
      value: '\b6 weeks\b'
      metric: long-form
    - type: regex
      value: '\b15(th)?\b'
      metric: long-form
    - *no-commentary-start
    - *no-commentary-phrases

- description: long-4 — spoken punctuation and line breaks (~35s) — commands scattered through a long dictation
  vars:
    transcript: >-
      meeting notes for Tuesday colon we went through the migration plan with the
      platform team new line the cutover is scheduled for March third at eleven PM and
      we're expecting about forty five minutes of downtime new line Priya will take the
      database snapshot and Tom will run the smoke tests afterwards period one open
      question comma does the on call roster cover that window question mark if it
      doesn't we'll have to push the whole thing to the following weekend which would
      move the release into April
  assert:
    - type: regex
      value: 'Meeting notes for Tuesday:'
      metric: long-form
    # "new line" appears twice, well past the opening — both must become breaks.
    - type: regex
      value: '\n[\s\S]*\n'
      metric: long-form
    - type: regex
      value: 'March 3(rd)?\b'
      metric: long-form
    - type: regex
      value: '11(:00)? ?[Pp]\.?[Mm]\.?'
      metric: long-form
    - type: contains
      value: 45 minutes
      metric: long-form
    - type: contains
      value: "?"
      metric: long-form
    # `\bcolon\b` rather than not-icontains, so a literal "semicolon" cannot trip it.
    - type: not-regex
      value: '\bcolon\b'
      metric: long-form
    - type: not-icontains
      value: new line
      metric: long-form
    - type: not-icontains
      value: question mark
      metric: long-form
    - type: not-icontains
      value: period
      metric: long-form
    - *no-commentary-start
    - *no-commentary-phrases

# The category needs an input that must survive untouched, otherwise it measures
# eagerness rather than judgement — and length is where eagerness shows up worst.
# Every sentence here elaborates on the same single object (the filtration unit),
# so no paragraph break is warranted no matter how many sentences there are; the
# numbers are already digits, and no number words are left to convert. `equals`
# because "unchanged, word-for-word" is the whole assertion.
- description: long-5 — NEGATIVE CONTROL (~35s) — long, already-clean, single-topic text passes through unchanged
  vars:
    transcript: >-
      The new filtration unit arrived on Tuesday and we installed it the same afternoon.
      It replaces the older units that were running at about 60% capacity, and it draws
      noticeably less power under full load. We ran it overnight at 80% to check the
      seals and found no leaks. The only outstanding item is the pressure sensor, which
      is delayed until the end of the month. Once that arrives we can bring the unit up
      to full capacity and decommission the old units.
  assert:
    - type: equals
      value: >-
        The new filtration unit arrived on Tuesday and we installed it the same afternoon.
        It replaces the older units that were running at about 60% capacity, and it draws
        noticeably less power under full load. We ran it overnight at 80% to check the
        seals and found no leaks. The only outstanding item is the pressure sensor, which
        is delayed until the end of the month. Once that arrives we can bring the unit up
        to full capacity and decommission the old units.
      metric: long-form
    - type: equals
      value: >-
        The new filtration unit arrived on Tuesday and we installed it the same afternoon.
        It replaces the older units that were running at about 60% capacity, and it draws
        noticeably less power under full load. We ran it overnight at 80% to check the
        seals and found no leaks. The only outstanding item is the pressure sensor, which
        is delayed until the end of the month. Once that arrives we can bring the unit up
        to full capacity and decommission the old units.
      metric: preservation

- description: long-6 — email wrapping a five-item list (~45s) — STEP 4 and STEP 5 must both fire in one output
  vars:
    transcript: >-
      Hi team, quick update before the weekend. The client call went well and they signed
      off on the scope so we're clear to start on Monday. Before then I need a few things
      wrapped up, the staging environment needs to be rebuilt, the API keys need
      rotating, the onboarding doc needs a final pass, the test data needs to be
      reloaded, and the invoice template needs updating with the new ABN. I've asked Sam
      to take the first two and I'll pick up the rest. If anything looks like it'll slip
      message me before five PM today so I can re-plan. Thanks, Elena
  assert:
    - type: regex
      value: '^Hi team,\n\n'
      metric: long-form
    - type: regex
      value: '(?:\n[-*•][^\n]*){5}'
      metric: long-form
    # The sign-off has to survive the list — a model that ends its output on the
    # last bullet passes the two assertions above and fails this one.
    - type: regex
      value: 'Thanks,\s+Elena\.?$'
      metric: long-form
    - type: regex
      value: '5(:00)? ?[Pp]\.?[Mm]\.?'
      metric: long-form
    - type: contains
      value: ABN
      metric: long-form
    - *no-commentary-start
    - *no-commentary-phrases
