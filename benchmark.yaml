dataset: evaluation/transcript-cleanup
omlx_url: http://localhost:8000/v1
concurrency: 8
publish_concurrency: 1
score_timeout_seconds: 300
generation_name: transcript-cleanup-generation

prompts:
  - id: v1
    file: prompts/v1.txt
  - id: v2
    file: prompts/v2.txt

models:
  - id: gemma-4-e4b-it-4bit
    label: Gemma 4 E4B
  - id: gemma-4-E2B-it-MLX-4bit
    label: Gemma 4 E2B
  - id: gemma-4-12B-it-qat-4bit
    label: Gemma 4 12B QAT
  - id: Qwen3.6-35B-A3B-MLX-4bit
    label: Qwen 3.6 35B-A3B
    chat_template_kwargs:
      enable_thinking: false

sampler:
  temperature: 0
  max_tokens: 8192
  top_p: 1.0
  top_k: 0
  min_p: 0.0
  presence_penalty: 0
  frequency_penalty: 0
  repetition_penalty: 1.0

